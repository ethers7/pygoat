version: '3.8'

services:
  broken_auth_lab:
    build: .
    container_name: broken_auth_lab
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_APP=app.py
      # Debug mode stays off; the container serves the app with gunicorn
      # (see the Dockerfile CMD), not with the Flask development server.
      - FLASK_DEBUG=0
      - PYTHONUNBUFFERED=1
    restart: unless-stopped 